name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  # Every job carries an explicit ceiling. Without one a job inherits GitHub's
  # 360-minute default, and `playwright install --with-deps` shells out to apt,
  # which hangs rather than fails when a package mirror stops responding. These
  # jobs finish in about a minute each, so the ceiling is pure headroom on a
  # healthy run and caps a hung one at minutes instead of six hours. It matters
  # more here than the duration suggests: `concurrency: deploy` admits one run at
  # a time, so a stalled job also holds off every later deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Build JS and CSS (needed for E2E tests)
        run: npm run build

      - name: Run Python unit tests
        run: uv run pytest tests/python -v

      - name: Run JS unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --group build

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Build JS and CSS
        run: npm run build

      - name: Generate Resume PDF
        run: uv run python tools/generate_resume_pdf.py

      - name: Process Career Stats
        run: uv run python tools/process_stats.py

      - name: Generate OG Image
        run: uv run python tools/generate_og_image.py

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml styles.css script.js script.js.map _headers _site/
          cp -R .well-known _site/
          cp -R resume _site/
          cp -R evolution _site/
          cp -R css _site/
          cp -R data _site/
          cp -R assets _site/

      # Renders the homepage sections into _site/index.html from the data just
      # assembled, so the page is complete without client-side data fetches.
      - name: Prerender homepage
        run: node tools/prerender.mjs _site

      - name: Check references
        run: |
          python3 - << 'PYEOF'
          import re, sys
          from pathlib import Path

          SITE_DIR = Path("_site")

          # HTML: match href="/..." and src="/..." attribute values (skip protocol-relative //)
          HTML_RE = re.compile(
              r'(?:href|src)=["\']'
              r'(/(?!/)[^"\'?#\s]*)'
              r'(?:[?#][^"\']*)?["\']'
          )

          # JS: match static string literals like "/assets/...", "/data/...", "/css/..."
          # Only checks simple literals — dynamic concatenations are not resolved
          JS_RE = re.compile(
              r'["\']'
              r'(/(?:assets|data|css|styles\.css|script\.js)[^"\'?#\s]*)'
              r'(?:[?#][^"\']*)?["\']'
          )

          errors = []

          html_files = list(SITE_DIR.glob("**/*.html"))
          if not html_files:
              print("ERROR: No HTML files found in _site", file=sys.stderr)
              sys.exit(1)

          for html_file in html_files:
              content = html_file.read_text(errors="replace")
              for m in HTML_RE.finditer(content):
                  path = m.group(1)
                  target = SITE_DIR / path.lstrip("/")
                  if not target.exists():
                      errors.append(f"  {html_file.relative_to(SITE_DIR)}: missing {path}")

          js_files = list(SITE_DIR.glob("**/*.js"))
          for js_file in js_files:
              content = js_file.read_text(errors="replace")
              for m in JS_RE.finditer(content):
                  path = m.group(1)
                  target = SITE_DIR / path.lstrip("/")
                  if not target.exists():
                      errors.append(f"  {js_file.relative_to(SITE_DIR)}: missing {path}")

          if errors:
              print(f"Reference check FAILED — {len(errors)} missing file(s):")
              for e in errors:
                  print(e)
              sys.exit(1)
          print(f"Reference check OK — {len(html_files)} HTML + {len(js_files)} JS file(s), no missing local paths.")
          PYEOF

      # Hidden files included: _site/.well-known and _site/_headers must ship.
      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The Cloudflare token exists only in this job, which runs nothing but
  # checkout, the lockfile install and wrangler (pinned in package-lock.json).
  # Only main deploys; a workflow_dispatch from another branch stops at build.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: _site

      - name: Install Node dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
