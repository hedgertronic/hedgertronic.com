# Weekly dependency updates. Minor and patch updates arrive as one grouped PR
# per ecosystem; each major update gets its own PR, since it may need code
# changes. For github-actions, Dependabot updates the pinned SHA and the
# trailing tag comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
